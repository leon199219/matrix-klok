; Matrix-Klok — ESP32 DevKit + WS2812B 8x32 + DS3231
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = min_spiffs.csv
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  fastled/FastLED@^3.9.0
  adafruit/RTClib@^2.1.4
  tzapu/WiFiManager@^2.0.17

; OTA-upload (na eerste USB-flash):  pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = matrix-klok.local
extra_scripts = pre:tools/ota_auth.py
